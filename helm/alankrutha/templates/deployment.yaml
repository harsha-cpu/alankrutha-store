apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alankrutha.fullname" . }}
  labels:
    {{- include "alankrutha.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alankrutha.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alankrutha.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: alankrutha
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "alankrutha.fullname" . }}-secret
                  key: NEXTAUTH_SECRET

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP