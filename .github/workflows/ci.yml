name: Alankrutha CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Next.js application
      - name: Build application
        run: npm run build

      # 5. Build Docker image
      - name: Build Docker image
        run: docker build -t alankrutha:${{ github.sha }} .

      # 6. Install Trivy
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0

      # 7. Scan Docker image
      - name: Trivy vulnerability scan
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            alankrutha:${{ github.sha }}